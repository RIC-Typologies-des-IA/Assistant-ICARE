name: Browser client checks
on:
  pull_request:
    paths: ["browser/**", ".github/workflows/browser-ci.yml"]
  push:
    branches-ignore: [main]
    paths: ["browser/**", ".github/workflows/browser-ci.yml"]
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install browser test runtime
        working-directory: browser
        run: |
          npm install --no-save playwright
          npm run build:vendor
          npx playwright install --with-deps chromium
      - name: Validate browser modules
        run: |
          node --check browser/app.js
          node --check browser/agent.js
          node --check browser/workspace-tools.js
          node --check browser/storage.js
          node --check browser/inference.js
          node --check browser/sw.js
          node --check browser/markdown.js
          node --test browser/test/*.test.js
          node browser/test/smoke.mjs
          python -m json.tool browser/icare.json >/dev/null
          python -m json.tool browser/manifest.webmanifest >/dev/null
          test -s browser/system-prompt.md
