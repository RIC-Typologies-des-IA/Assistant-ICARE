name: ICARE formal models

on:
  pull_request:
    paths:
      - "spec/ICAREProjectAccess.tla"
      - "spec/ICAREProjectAccess.cfg"
      - "spec/ICAREConversationForests.tla"
      - "spec/ICAREConversationForests.cfg"
      - ".github/workflows/icare-formal-model.yml"
  push:
    branches: [main]
    paths:
      - "spec/ICAREProjectAccess.tla"
      - "spec/ICAREProjectAccess.cfg"
      - "spec/ICAREConversationForests.tla"
      - "spec/ICAREConversationForests.cfg"
      - ".github/workflows/icare-formal-model.yml"

jobs:
  tlc:
    name: TLC finite-state verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download pinned TLA+ tools
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            --output /tmp/tla2tools.jar
      - name: Check project access invariants
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -workers 2 \
            -config spec/ICAREProjectAccess.cfg \
            spec/ICAREProjectAccess.tla
      - name: Check conversation and configuration forests
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -workers 2 \
            -config spec/ICAREConversationForests.cfg \
            spec/ICAREConversationForests.tla
