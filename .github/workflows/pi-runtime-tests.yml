name: Pi runtime tests

on:
  push:
    branches: [main, "implementation/**"]
    paths:
      - "pi-runtime/**"
      - "flake.nix"
      - ".github/workflows/pi-runtime-tests.yml"
  pull_request:
    paths:
      - "pi-runtime/**"
      - "flake.nix"
      - ".github/workflows/pi-runtime-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: pi-runtime
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: node --check pi-runtime/src/server.js
      - name: Run runtime tests
        working-directory: pi-runtime
        run: npm test

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Evaluate and build the QEMU VM image
        run: nix build --no-link .#nixosConfigurations.icare-vm.config.system.build.vm
