name: Pi runtime tests

on:
  push:
    branches: [main, "implementation/**"]
    paths:
      - "pi-runtime/**"
      - "flake.nix"
      - "nixos/**"
      - "tools/**"
      - ".github/workflows/pi-runtime-tests.yml"
  pull_request:
    paths:
      - "pi-runtime/**"
      - "prompt/**"
      - "tools/**"
      - "nixos/**"
      - "flake.nix"
      - "README.md"
      - ".github/workflows/pi-runtime-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: pi-runtime
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check launcher syntax
        run: bash -n tools/icare
      - name: Check JavaScript syntax
        run: node --check pi-runtime/src/server.js
      - name: Run runtime tests
        working-directory: pi-runtime
        run: npm test

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Evaluate Linux and macOS launchers
        run: |
          nix eval --raw .#packages.x86_64-linux.default.name
          nix eval --raw .#packages.aarch64-linux.default.name
          nix eval --raw .#packages.x86_64-darwin.default.name
          nix eval --raw .#packages.aarch64-darwin.default.name
      - name: Evaluate and build the x86_64 QEMU VM image
        run: nix build --no-link .#nixosConfigurations.x86_64-linux.icare-vm.config.system.build.vm
