name: Deploy autonomous browser app
on:
  push:
    branches: [main]
    paths: ["browser/**", ".github/workflows/deploy-browser.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate application
        run: |
          test -s browser/index.html
          test -s browser/app.js
          node --check browser/app.js
          node --check browser/agent.js
          node --check browser/workspace-tools.js
          node --check browser/storage.js
          node --check browser/inference.js
          node --check browser/sw.js
          node --test browser/test/*.test.js
          python -m json.tool browser/icare.json >/dev/null
          python -m json.tool browser/manifest.webmanifest >/dev/null
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("browser/package.json")); const s=fs.readFileSync("browser/version.js","utf8"); const v=s.match(/"([^"]+)"/)?.[1]; const parts=v?.split("."); if (p.version!==v || parts?.length!==3 || parts.some(x=>!/^[0-9]+$/.test(x))) throw new Error("Invalid or inconsistent MAJOR.MINOR.PATCH: "+p.version+" / "+v);'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: browser
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
