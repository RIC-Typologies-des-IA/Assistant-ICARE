name: Deploy autonomous browser app
on:
  push:
    branches: [main]
    paths: ["browser/**", ".github/workflows/deploy-browser.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/configure-pages@v5
      - name: Install production dependencies and build vendor assets
        working-directory: browser
        run: |
          npm install --no-save
          npm run build:vendor
      - name: Stamp immutable deployment identity
        run: |
          printf '\nself.ICARE_BUILD_ID = "%s";\n' "$GITHUB_SHA" >> browser/version.js
          node --check browser/version.js
      - name: Verify deployment artifact
        run: |
          test -s browser/index.html
          test -s browser/app.js
          test -s browser/version.js
          grep -q "ICARE_BUILD_ID" browser/version.js
          test -s browser/vendor/markdown-it.min.js
          test -s browser/vendor/purify.min.js
      - name: Upload the single Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: browser

  deploy:
    name: Deploy Pages artifact
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy the artifact produced by the build job
        id: deployment
        uses: actions/deploy-pages@v4
