name: Deploy autonomous browser app
on:
  push:
    branches: [main]
    paths: ["browser/**", ".github/workflows/deploy-browser.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/configure-pages@v5
      - name: Install production dependencies and build vendor assets
        working-directory: browser
        run: |
          npm install --no-save
          npm run build:vendor
      - name: Verify deployment artifact
        run: |
          test -s browser/index.html
          test -s browser/app.js
          test -s browser/version.js
          test -s browser/vendor/markdown-it.min.js
          test -s browser/vendor/purify.min.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: browser
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
