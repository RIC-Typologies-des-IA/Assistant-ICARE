name: Deploy autonomous browser app
on:
  push:
    branches: [main]
    paths: ["browser/**", ".github/workflows/deploy-browser.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate application
        run: |
          test -s browser/index.html
          test -s browser/app.js
          node --check browser/app.js
          node --check browser/storage.js
          node --check browser/inference.js
          node --check browser/sw.js
          node --test browser/test/*.test.js
          python -m json.tool browser/icare.json >/dev/null
          python -m json.tool browser/manifest.webmanifest >/dev/null
      - uses: actions/upload-pages-artifact@v3
        with:
          path: browser
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
